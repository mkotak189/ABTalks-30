version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coverage-chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_MODEL=llama3.1
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./coverage.db:/app/coverage.db
      - ./chroma_data:/app/chroma_data
      - ./knowledge_base.jsonl:/app/knowledge_base.jsonl
    networks:
      - chatbot-network
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: coverage-chatbot-frontend
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:8000
    env_file:
      - .env
    networks:
      - chatbot-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Ollama LLM Service (if running locally)
  ollama:
    image: ollama/ollama:latest
    container_name: coverage-chatbot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - chatbot-network
    restart: unless-stopped

networks:
  chatbot-network:
    driver: bridge

volumes:
  ollama_data: