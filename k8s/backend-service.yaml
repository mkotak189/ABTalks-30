apiVersion: v1
kind: Service
metadata:
  name: coverage-chatbot-backend
  namespace: default
  labels:
    app: coverage-chatbot
    component: backend
spec:
  type: NodePort  # Exposes service on node IP:port
  # For ClusterIP only (internal): type: ClusterIP
  ports:
  - port: 8000           # Service port
    targetPort: 8000     # Container port
    protocol: TCP
    name: http
  selector:
    app: coverage-chatbot
    component: backend
  # Session affinity optional
  sessionAffinity: ClientIP  # Route same client to same pod
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800