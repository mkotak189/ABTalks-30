apiVersion: v1
kind: Service
metadata:
  name: coverage-chatbot-frontend
  namespace: default
  labels:
    app: coverage-chatbot
    component: frontend
spec:
  type: NodePort  # Exposes service on node IP:port
  ports:
  - port: 8501           # Service port
    targetPort: 8501     # Container port
    protocol: TCP
    name: http
  selector:
    app: coverage-chatbot
    component: frontend